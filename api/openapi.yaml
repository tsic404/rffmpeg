openapi: 3.0.3
info:
  title: rffmpeg API
  description: Remote ffmpeg transcoding service API
  version: 1.0.0
  contact:
    name: rffmpeg
    url: https://github.com/tsic404/rffmpeg

servers:
  - url: /api/v1
    description: Default server

tags:
  - name: jobs
    description: Job management operations
  - name: files
    description: File upload and download operations
  - name: workers
    description: Worker registration and management
  - name: health
    description: Health check endpoints
  - name: migrations
    description: Worker migration audit events

paths:
  /upload:
    post:
      tags: [files]
      summary: Upload input file
      description: Upload an input file for transcoding (simple single-request upload)
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                checksum:
                  type: string
                  description: Optional SHA256 checksum
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '507':
          $ref: '#/components/responses/InsufficientStorage'

  /upload/init:
    post:
      tags: [files]
      summary: Initialize chunked upload
      description: Initialize a new chunked upload session for large files
      operationId: initChunkUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkUploadInitRequest'
      responses:
        '200':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkUploadInitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /upload/chunk/{uploadId}/{chunkIndex}:
    post:
      tags: [files]
      summary: Upload a chunk
      description: Upload a single chunk of a chunked upload session
      operationId: uploadChunk
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: chunkIndex
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chunk]
              properties:
                chunk:
                  type: string
                  format: binary
                checksum:
                  type: string
                  description: Optional SHA256 checksum of the chunk
      responses:
        '200':
          description: Chunk uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job is no longer assigned to this worker
        '507':
          $ref: '#/components/responses/InsufficientStorage'

  /upload/progress/{uploadId}:
    get:
      tags: [files]
      summary: Get upload progress
      description: Get the progress of a chunked upload session
      operationId: getUploadProgress
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProgressResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /upload/complete:
    post:
      tags: [files]
      summary: Complete chunked upload
      description: Finalize a chunked upload and assemble the file
      operationId: completeChunkUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkUploadCompleteRequest'
      responses:
        '200':
          description: File assembled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkUploadCompleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /upload/cancel/{uploadId}:
    post:
      tags: [files]
      summary: Cancel chunked upload
      description: Cancel a chunked upload session and clean up temporary files
      operationId: cancelChunkUpload
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /upload/resume/{uploadId}:
    get:
      tags: [files]
      summary: Resume chunked upload
      description: Get information needed to resume an interrupted chunked upload
      operationId: resumeChunkUpload
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload resume information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResumeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs:
    post:
      tags: [jobs]
      summary: Submit transcoding job
      description: Submit a new transcoding job with input files and ffmpeg arguments
      operationId: submitJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '200':
          description: Job submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [jobs]
      summary: List jobs
      description: >-
        List transcoding jobs, newest first, with pagination. Returns full job
        metadata (input_files, args, output_filename, direct_paths, etc.) to any
        authenticated caller, matching the single-token access model of
        GET /jobs/{jobId}.
      operationId: listJobs
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of jobs to return (default 50, max 500)
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Number of jobs to skip (default 0)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Get job status
      description: Query the status of a transcoding job
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [jobs]
      summary: Cancel job
      description: Cancel a pending or running job
      operationId: cancelJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCancelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [jobs]
      summary: Update job status
      description: Worker updates job status, stderr, or progress
      operationId: updateJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdateRequest'
      responses:
        '200':
          description: Job updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobUpdateResponse'
        '400':
          description: Malformed body, invalid status/failure_type, or missing worker_id
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job is no longer assigned to this worker, or is already terminal

  /jobs/{jobId}/log:
    get:
      tags: [jobs]
      summary: Subscribe to job stderr stream
      description: WebSocket endpoint for real-time stderr streaming
      operationId: jobLogStream
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: >-
            Malformed WebSocket handshake: the upgrade headers are present but
            the handshake itself is invalid (bad `Sec-WebSocket-Key`, missing
            `Sec-WebSocket-Version`). Answered as a plain-text 400, not the JSON
            error shape.
        '426':
          $ref: '#/components/responses/UpgradeRequired'

  /jobs/{jobId}/output:
    post:
      tags: [jobs]
      summary: Upload output file
      description: |
        Worker uploads the transcoded output file. The uploading worker must
        identify itself with `worker_id`; an upload from a worker that no
        longer owns an active job is refused with 409 so a stale worker cannot
        overwrite the new owner's product.
      operationId: uploadJobOutput
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: worker_id
          in: query
          required: true
          description: Identifier of the uploading worker.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                checksum:
                  type: string
      responses:
        '200':
          description: Output uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOutputUploadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '507':
          $ref: '#/components/responses/InsufficientStorage'

  /output/{fileId}:
    get:
      tags: [files]
      summary: Download output file
      description: Download transcoded output file
      operationId: downloadOutput
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Output file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/register:
    post:
      tags: [workers]
      summary: Register worker
      description: Register a new worker with its capabilities
      operationId: registerWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegisterRequest'
      responses:
        '200':
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegisterResponse'

  /workers/heartbeat:
    post:
      tags: [workers]
      summary: Worker heartbeat
      description: Send heartbeat to maintain registration
      operationId: workerHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerHeartbeatResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers:
    get:
      tags: [workers]
      summary: List workers
      description: List all registered workers with capabilities and health metrics
      operationId: listWorkers
      parameters:
        - name: active_only
          in: query
          required: false
          description: When true, return only non-offline workers (default includes offline rows retained within the offline threshold).
          schema:
            type: boolean
      responses:
        '200':
          description: Workers registered on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkersListResponse'
  /workers/{workerId}:
    get:
      tags: [workers]
      summary: Get worker
      description: Get a single registered worker with capabilities and health metrics
      operationId: getWorker
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Worker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerGetResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/{workerId}/jobs:
    get:
      tags: [workers]
      summary: Pull pending jobs
      description: Worker pulls assigned jobs for processing
      operationId: pullWorkerJobs
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Jobs to process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerJobPullResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags: [health]
      summary: Health check
      description: >-
        Check server health status. A probe without credentials is exempt from
        authentication and rate limiting, and receives `status` alone. A probe
        that presents a bearer token is validated: a valid one adds `version`
        and `auth_enabled`, an invalid one (or any credential on a server
        without a configured token) is rejected with 401. The same contract
        applies to `/api/v1/health`.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /migrations:
    get:
      tags: [migrations]
      summary: List migration events
      description: >-
        List worker migration audit events, newest first (timestamp DESC, id
        DESC), with pagination. Each event records a batch of jobs migrated
        back to pending after a worker failure or timeout.
      operationId: listMigrationEvents
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return (default 50, max 500)
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Number of events to skip (default 0)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of migration events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /migrations/{eventId}:
    get:
      tags: [migrations]
      summary: Get migration event
      description: Retrieve a single worker migration audit event by ID.
      operationId: getMigrationEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Migration event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationEventResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{fileId}:
    get:
      tags: [files]
      summary: Download an input file
      description: >-
        Download a stored input file by its content-addressed identifier. The
        response body is the file itself; Range requests are not supported.
      operationId: downloadFile
      parameters:
        - name: fileId
          in: path
          required: true
          description: 64-hex SHA-256 content hash
          schema:
            type: string
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /encoders:
    get:
      tags: [workers]
      summary: List encoders across the cluster
      description: All unique encoders reported by registered workers, with hardware flags.
      operationId: listEncoders
      responses:
        '200':
          description: Encoder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  encoders:
                    type: array
                    items:
                      $ref: '#/components/schemas/EncoderInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /encoders/{encoder}/workers:
    get:
      tags: [workers]
      summary: List workers that advertise an encoder
      operationId: listWorkersByEncoder
      parameters:
        - name: encoder
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workers advertising the encoder
          content:
            application/json:
              schema:
                type: object
                properties:
                  encoder:
                    type: string
                  workers:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /decoders:
    get:
      tags: [workers]
      summary: List decoders across the cluster
      operationId: listDecoders
      responses:
        '200':
          description: Decoder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  decoders:
                    type: array
                    items:
                      $ref: '#/components/schemas/DecoderInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /codecs:
    get:
      tags: [workers]
      summary: List codecs across the cluster
      description: >-
        Plain-text ffmpeg-style list by default. With ?json=1 the same items
        are returned as a JSON object.
      operationId: listCodecs
      parameters:
        - $ref: '#/components/parameters/JsonFlag'
      responses:
        '200':
          description: Codec list
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/InfoFlagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /filters:
    get:
      tags: [workers]
      summary: List filters across the cluster
      operationId: listFilters
      parameters:
        - $ref: '#/components/parameters/JsonFlag'
      responses:
        '200':
          description: Filter list
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/InfoFlagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pix_fmts:
    get:
      tags: [workers]
      summary: List pixel formats across the cluster
      operationId: listPixFmts
      parameters:
        - $ref: '#/components/parameters/JsonFlag'
      responses:
        '200':
          description: Pixel format list
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/InfoFlagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /formats:
    get:
      tags: [workers]
      summary: List container formats across the cluster
      operationId: listFormats
      parameters:
        - $ref: '#/components/parameters/JsonFlag'
      responses:
        '200':
          description: Format list
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/InfoFlagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hwaccels:
    get:
      tags: [workers]
      summary: List hardware acceleration methods across the cluster
      description: >-
        Plain-text single-column list by default. With ?json=true (or json=1)
        the same items are returned as a JSON object.
      operationId: listHwaccels
      parameters:
        - $ref: '#/components/parameters/JsonFlag'
      responses:
        '200':
          description: Hardware acceleration method list
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  hwaccels:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /probe:
    post:
      tags: [jobs]
      summary: Probe an input with ffprobe through a worker
      description: >-
        Dispatches a real probe job to a live worker and returns the ffprobe
        result with rffmpeg extensions under the reserved `_rffmpeg` key.
      operationId: probeInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeRequest'
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /admin/config:
    servers:
      - url: /
    get:
      tags: [admin]
      summary: Read runtime rate-limit configuration
      operationId: getAdminConfig
      responses:
        '200':
          description: Current runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [admin]
      summary: Update runtime rate-limit configuration
      operationId: updateAdminConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate_limit_enabled:
                  type: boolean
                max_concurrent_jobs_per_client:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Configuration after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/metrics:
    servers:
      - url: /
    get:
      tags: [admin]
      summary: Read rate-limit metrics
      operationId: getAdminMetrics
      responses:
        '200':
          description: Rate-limit counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_active_jobs:
                    type: integer
                  rejected_count:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/workers/eviction/clear:
    servers:
      - url: /
    post:
      tags: [admin]
      summary: Clear one worker's eviction mark
      description: >-
        Releases the eviction mark of a single worker located by identifier or
        registered name. Registration and pull restrictions lift with it; the
        cumulative completion count is untouched.
      operationId: clearWorkerEviction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker]
              properties:
                worker:
                  type: string
                  description: Worker identifier or registered name
      responses:
        '200':
          description: Eviction mark cleared (or already clear)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearWorkerEvictionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    JsonFlag:
      name: json
      in: query
      required: false
      description: Return the list as JSON instead of plain text (value 1 or true).
      schema:
        type: string
        enum: ['1', 'true']

  schemas:
    UploadResponse:
      type: object
      required: [file_id]
      properties:
        file_id:
          type: string
          description: SHA-256 content hash of the uploaded file (lowercase hex, 64 chars). Identical content always yields the same file_id; the id is content-addressed, not a random UUID.
        message:
          type: string

    JobSubmitRequest:
      type: object
      required: [input_files, args]
      properties:
        input_files:
          type: array
          items:
            type: string
          description: List of input file IDs
        args:
          type: array
          items:
            type: string
          description: ffmpeg arguments
        priority:
          type: integer
          default: 0
        timeout:
          type: integer
          description: Per-job ffmpeg execution budget in nanoseconds (omitted = worker default)
        output_filename:
          type: string
          description: Desired output filename for the job
        streaming_output:
          type: boolean
          description: Stream output to stdout via WebSocket instead of saving to file
        auto_hw:
          type: boolean
          description: Enable automatic hardware encoder upgrade
        direct_path:
          type: string
          description: Direct output path for pass-through mode (TSI-807). When set, output is written directly to this path without server storage.

    JobSubmitResponse:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid
        message:
          type: string

    JobInfo:
      type: object
      required: [id, status, input_files, args, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        input_files:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        output_files:
          type: array
          items:
            type: string
        output_filename:
          type: string
        streaming_output:
          type: boolean
          description: Output is streamed over the WebSocket log channel instead of stored.
        auto_hw:
          type: boolean
          description: Automatic hardware encoder upgrade was requested for this job.
        timeout:
          type: integer
          description: Per-job ffmpeg execution budget in nanoseconds (omitted = worker default).
        no_worker_deadline:
          type: string
          format: date-time
          description: >-
            Server-computed time at which a still-pending job is failed as
            NO_WORKER_AVAILABLE. Omitted for non-pending jobs, when the sweep is
            disabled, or while a live schedulable worker exists.
        progress_percent:
          type: number
          format: double
          description: Last reported progress percentage (0-100).
        eta_seconds:
          type: integer
          description: Last reported ETA in seconds (0 when no estimate is available).
        worker_id:
          type: string
          format: uuid
        assigned_worker:
          type: string
          description: Worker ID of the executor; survives terminal state for historical attribution.
        worker_name:
          type: string
          description: Human-readable name of the assigned worker.
        exit_code:
          type: integer
        error:
          type: string
        failure_type:
          type: string
          enum: [INPUT_UNREACHABLE, ENCODER_UNSUPPORTED, ENCODER_UNAVAILABLE, DISK_FULL, TIMEOUT, WORKER_CRASH, FFMPEG_ERROR, NO_WORKER_AVAILABLE, INFRA]
          description: Machine-readable failure category (set on failed/timeout jobs).
        failure_details:
          type: string
          description: Human-readable failure details.
        retryable:
          type: boolean
          description: Whether the failure type is worth retrying (TSI-2958).
        retry_count:
          type: integer
          description: Times the job was migrated off a failed worker; >0 marks a re-dispatch. Omitted for fresh jobs.
        cached:
          type: boolean
          description: Whether the result was served from the worker cache (TSI-2519).
        direct_paths:
          type: array
          items:
            type: string
          description: Direct output paths for pass-through mode (TSI-807). When set, output is written directly to these paths without server storage.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
          description: When a worker claimed the job (pending -> queued). Cleared on requeue, so a pending job omits it.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    JobStatus:
      type: string
      enum: [pending, queued, running, completed, failed, cancelled]

    JobStatusResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: '#/components/schemas/JobInfo'

    JobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobInfo'

    JobCancelResponse:
      type: object
      properties:
        message:
          type: string

    JobUpdateRequest:
      type: object
      required: [worker_id]
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
        exit_code:
          type: integer
        error:
          type: string
        failure_type:
          type: string
          enum: [INPUT_UNREACHABLE, ENCODER_UNSUPPORTED, ENCODER_UNAVAILABLE, DISK_FULL, TIMEOUT, WORKER_CRASH, FFMPEG_ERROR, NO_WORKER_AVAILABLE, INFRA]
          description: Machine-readable failure category set when the job fails.
        cached:
          type: boolean
          description: Whether the completed result was served from the worker cache (TSI-2519).
        failure_details:
          type: string
          description: Human-readable failure details.
        stderr_chunk:
          type: string
        stdout_chunk:
          type: string
          description: Base64-encoded raw stdout bytes (binary-safe).
        progress:
          type: number
          format: double
        eta_seconds:
          type: integer
          description: Estimated seconds remaining (0 when no estimate is available).
        time_us:
          type: integer
          format: int64
          description: Current decoded time in microseconds.
        duration_us:
          type: integer
          format: int64
          description: Total duration in microseconds (0 when unknown).
        speed:
          type: number
          format: double
          description: Current encoding speed multiplier.
        worker_id:
          type: string
          description: >-
            Reporting worker identity (required). Every update is
            ownership-guarded: the server returns 409 if this worker no longer
            owns the job (reassigned after failover, or already finished), and
            400 when the field is missing.

    JobUpdateResponse:
      type: object
      properties:
        message:
          type: string

    JobOutputUploadResponse:
      type: object
      properties:
        message:
          type: string

    EncoderInfo:
      type: object
      required: [name, type, is_hw]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: '"video", "audio", or "subtitle"'
        is_hw:
          type: boolean
          description: True when hardware-accelerated
        priority:
          type: integer
          description: User-defined priority; higher is preferred

    DecoderInfo:
      type: object
      required: [name, type, is_hw]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: '"video", "audio", or "subtitle"'
        is_hw:
          type: boolean
          description: True when hardware-accelerated

    GPUDevice:
      type: object
      required: [type, accessible]
      properties:
        type:
          type: string
          description: '"nvenc", "qsv", "vaapi", "amf", "videotoolbox", or "d3d11"'
        path:
          type: string
          description: Device path (e.g. /dev/dri/renderD128)
        name:
          type: string
          description: Device name/model
        driver_version:
          type: string
        vendor:
          type: string
        accessible:
          type: boolean
        qsv_healthy:
          type: boolean
          description: Whether the QSV MFX runtime is functional (Intel only)
        qsv_error:
          type: string
          description: Error message when the QSV health check failed

    WorkerCapabilities:
      type: object
      required: [encoders, ffmpeg_version]
      properties:
        gpu_model:
          type: string
          description: >-
            Legacy single-value GPU model. Defaults to gpu_devices[0].name when
            auto-detected, but is set independently (manual_gpu_model) when
            auto-detection is disabled.
        gpu_devices:
          type: array
          items:
            $ref: '#/components/schemas/GPUDevice'
          description: All detected GPU devices; persisted and returned by GET /api/v1/workers
        encoders:
          type: array
          description: Video-only flat encoder name list (canonical field)
          items:
            type: string
        decoders:
          type: array
          description: Video-only flat decoder name list (canonical field)
          items:
            type: string
        ffmpeg_version:
          type: string
        max_concurrent:
          type: integer
          default: 1
        video_encoders:
          type: array
          items:
            $ref: '#/components/schemas/EncoderInfo'
          description: Optional request-side rich encoder metadata; consumed by GET /api/v1/encoders only
        video_decoders:
          type: array
          items:
            $ref: '#/components/schemas/DecoderInfo'
          description: Optional request-side rich decoder metadata; consumed by GET /api/v1/decoders only

    WorkerRegisterRequest:
      type: object
      required: [capabilities]
      properties:
        worker_id:
          type: string
          format: uuid
        name:
          type: string
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'

    WorkerRegisterResponse:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          format: uuid
        message:
          type: string

    WorkerHeartbeatRequest:
      type: object
      required: [worker_id, status]
      properties:
        worker_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WorkerStatus'
        active_jobs:
          type: array
          items:
            type: string
            format: uuid
        jobs_per_sec:
          type: number
          format: double
          description: >-
            Worker throughput in jobs per second since the last heartbeat.
            Always present (0 when no job completed in the window).
        gpu_metrics_valid:
          type: boolean
          description: >-
            True when gpu_util_percent / gpu_mem_used_mb carry a fresh
            sample from any GPU source (nvidia-smi, intel_gpu_top, or
            amdgpu sysfs). When false, both fields are 0 and mean "no
            sample available", not "0% utilization".
        gpu_util_percent:
          type: number
          format: double
          description: >-
            Aggregated GPU utilization across all GPUs of the worker: on a
            multi-GPU host this is the SUM (two GPUs at 50% report 100), so
            values above 100 are valid there. Meaningful only when
            gpu_metrics_valid is true.
        gpu_mem_used_mb:
          type: integer
          format: int64
          description: Total GPU memory in use across all GPUs, megabytes. Meaningful only when gpu_metrics_valid is true.

    WorkerStatus:
      type: string
      enum: [idle, busy, offline]

    WorkerHeartbeatResponse:
      type: object
      properties:
        message:
          type: string

    WorkerJobPullResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobInfo'

    WorkerHealth:
      type: object
      required: [status, gpu_metrics_valid, gpu_util_percent, gpu_mem_used_mb, last_seen]
      properties:
        status:
          $ref: '#/components/schemas/WorkerStatus'
        gpu_metrics_valid:
          type: boolean
          description: >-
            True when gpu_util_percent / gpu_mem_used_mb carry a fresh
            sample from any GPU source (nvidia-smi, intel_gpu_top, or
            amdgpu sysfs). Always present, and the field that separates a
            GPU genuinely idle at 0% from a host that took no sample.
        gpu_util_percent:
          type: number
          format: double
          description: >-
            Aggregated GPU utilization across all GPUs (sum; values above 100
            are valid on multi-GPU hosts). Always present: 0 before the first
            valid sample, and a real 0% reading stays 0 with
            gpu_metrics_valid=true. Reflects the last valid sample; stale
            until the next heartbeat with gpu_metrics_valid=true.
        gpu_mem_used_mb:
          type: integer
          format: int64
          description: >-
            Total GPU memory in use across all GPUs, megabytes. Always
            present: 0 before the first valid sample (last valid sample
            thereafter).
        active_jobs:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of jobs currently running on this worker
        jobs_per_sec:
          type: number
          format: double
          description: >-
            Worker throughput in jobs per second since the last heartbeat.
            Always present (0 when no job completed in the window).
        ewma_jobs_per_sec:
          type: number
          format: double
          description: >-
            EWMA-smoothed worker throughput in jobs per second (see
            jobs_per_sec). The raw value slow-node detection compares against
            the cluster median. Always present (0 until the first heartbeat
            sample).
        completed_jobs:
          type: integer
          format: int64
          description: >-
            Cumulative jobs this worker has completed since its current
            registration; failures, cancels and probe jobs are not counted.
            Slow-node eviction excludes workers still inside its warmup window
            (completed_jobs below workerhealth.MinJobsForEviction), so this
            count is how a client observes whether a worker is eligible yet.
            Always present (0 before the first heartbeat).
        last_seen:
          type: string
          format: date-time

    WorkerInfo:
      type: object
      required: [id, status, encoders, ffmpeg_version, max_concurrent, last_heartbeat, created_at, health]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/WorkerStatus'
        evicted:
          type: boolean
          description: Whether the worker is currently evicted from scheduling as a slow node
        gpu_model:
          type: string
          description: >-
            Legacy single-value GPU model. Defaults to the first device name
            when auto-detected; may be set independently (manual_gpu_model)
            with no corresponding gpu_devices.
        gpu_devices:
          type: array
          items:
            $ref: '#/components/schemas/GPUDevice'
          description: All detected GPU devices (multi-card hosts include every card)
        encoders:
          type: array
          items:
            type: string
        decoders:
          type: array
          items:
            type: string
        ffmpeg_version:
          type: string
        max_concurrent:
          type: integer
        last_heartbeat:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        health:
          $ref: '#/components/schemas/WorkerHealth'

    WorkersListResponse:
      type: object
      required: [workers]
      properties:
        workers:
          type: array
          items:
            $ref: '#/components/schemas/WorkerInfo'
        cluster_median_throughput:
          type: number
          format: double
          description: >-
            Cluster median of EWMA throughput across eligible workers (offline,
            warmup, and idle workers excluded), matching the median slow-node
            detection uses. 0 when fewer than two eligible samples exist.

    WorkerGetResponse:
      type: object
      required: [worker]
      properties:
        worker:
          $ref: '#/components/schemas/WorkerInfo'

    HealthResponse:
      type: object
      description: >-
        Anonymous probes receive `status` alone. `version` and `auth_enabled`
        are added only when the request presents a valid bearer token, and are
        then always present. Judged by key existence, not by value.
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
        auth_enabled:
          type: boolean
          description: Whether token authentication is configured on the server

    ChunkUploadInitRequest:
      type: object
      required: [filename, file_size]
      properties:
        filename:
          type: string
        file_size:
          type: integer
          format: int64
        chunk_size:
          type: integer
          format: int64
          description: Optional chunk size in bytes (default 10MB)
        total_chunks:
          type: integer
          description: Optional total chunk count (calculated from file_size/chunk_size)
        checksum:
          type: string
          description: Optional SHA256 checksum of entire file for final verification

    ChunkUploadInitResponse:
      type: object
      required: [upload_id, chunk_size, total_chunks]
      properties:
        upload_id:
          type: string
        chunk_size:
          type: integer
          format: int64
        total_chunks:
          type: integer
        message:
          type: string

    ChunkUploadResponse:
      type: object
      required: [upload_id, chunk_index]
      properties:
        upload_id:
          type: string
        chunk_index:
          type: integer
        message:
          type: string

    UploadProgressResponse:
      type: object
      required: [upload_id, filename, file_size, chunk_size, total_chunks, status]
      properties:
        upload_id:
          type: string
        filename:
          type: string
        file_size:
          type: integer
          format: int64
        chunk_size:
          type: integer
          format: int64
        total_chunks:
          type: integer
        uploaded_chunks:
          type: integer
        uploaded_size:
          type: integer
          format: int64
        completed_chunks:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [in_progress, completed, expired, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChunkUploadCompleteRequest:
      type: object
      required: [upload_id]
      properties:
        upload_id:
          type: string
        checksum:
          type: string
          description: Optional SHA256 checksum for final verification

    ChunkUploadCompleteResponse:
      type: object
      required: [file_id]
      properties:
        file_id:
          type: string
          description: SHA-256 content hash of the assembled file (lowercase hex, 64 chars). Content-addressed, so byte-identical uploads resolve to the same file_id.
        message:
          type: string

    UploadResumeResponse:
      type: object
      properties:
        upload_id:
          type: string
        filename:
          type: string
        chunk_size:
          type: integer
          format: int64
        total_chunks:
          type: integer
        completed_chunks:
          type: array
          items:
            type: integer
        missing_chunks:
          type: array
          items:
            type: integer
        status:
          type: string

    MigrationEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/MigrationEventInfo'

    MigrationEventResponse:
      type: object
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/MigrationEventInfo'

    MigrationEventInfo:
      type: object
      required: [id, timestamp, worker_id, reason, retry_count, job_ids, jobs_migrated]
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        worker_id:
          type: string
        worker_name:
          type: string
        reason:
          type: string
          enum: [heartbeat_timeout, worker_offline, server_restart, job_timeout]
        retry_count:
          type: integer
        job_ids:
          type: array
          items:
            type: string
        jobs_migrated:
          type: integer
        targets:
          type: array
          items:
            $ref: '#/components/schemas/MigrationRedistributionTarget'

    MigrationRedistributionTarget:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
        retry_count:
          type: integer
        target_worker_id:
          type: string
        target_worker_name:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string

    ProbeRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: >-
            Input identifier: a stored file ID, a remote URL, or a
            shared-filesystem path (resolved by the Worker).
    ProbeResponse:
      type: object
      properties:
        format: {}
        streams: {}
        _rffmpeg:
          $ref: '#/components/schemas/RffmpegMeta'
        error:
          type: string
        message:
          type: string
    RffmpegMeta:
      type: object
      properties:
        worker_encoders:
          type: array
          items:
            type: string
        worker_encoder_overrides:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        suggestion:
          type: object
          properties:
            recommended_encoder:
              type: string
            reason:
              type: string
        workers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
              ffmpeg_version:
                type: string
              max_concurrent:
                type: integer
    InfoFlagResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    AdminConfig:
      type: object
      properties:
        rate_limit_enabled:
          type: boolean
        max_concurrent_jobs_per_client:
          type: integer
    ClearWorkerEvictionResponse:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        worker_name:
          type: string
        evicted:
          type: boolean
          description: Always false after a successful clear.
        cleared:
          type: boolean
          description: False when the worker was not evicted in the first place.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: No worker available to accept the job
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientStorage:
      description: Insufficient disk space to complete the upload (disk full)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpgradeRequired:
      description: >-
        The request did not ask for a WebSocket upgrade (bare GET, or missing
        `Connection: Upgrade` / `Upgrade: websocket`); the body is an
        `ErrorResponse` with `code` `upgrade_required`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Concurrent-job limit exceeded (job not created or queued)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Probe or job waiting time exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
