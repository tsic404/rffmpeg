# GitHub Actions: PR Check
# rffmpeg (Go) — PR 时触发 lint + test + build

name: PR Check

on:
  pull_request:
    branches: [master, main]
  # fork 分支推送时也运行（fork PR 的 checks 取自 base 仓库，bootstrap 前先在 fork 侧验证）
  push:
    branches: [master, main]
  # 也允许手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      # 测试依赖 ffmpeg >= 8 的输出格式（Ubuntu 24.04 自带 6.1 缺少 filters 分隔行）
      - name: Install ffmpeg (>= 8)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-24-13-10/ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl-8.1.tar.xz -o /tmp/ffmpeg.tar.xz
          mkdir /tmp/ff && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ff --strip-components=1
          sudo mv /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/

      - name: Download deps
        run: go mod download

      # === Lint ===
      - name: Lint (Go)
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "gofmt needed"; exit 1; }

      # === Test ===
      - name: Test (Go)
        run: go test -v ./...

      # === Build (验证可构建) ===
      - name: Build (Go)
        run: go build ./...
