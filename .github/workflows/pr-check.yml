# GitHub Actions: PR Check
# rffmpeg (Go) — PR 时触发 lint + test + build

name: PR Check

on:
  pull_request:
    branches: [master, main]
  # fork 分支推送时也运行（fork PR 的 checks 取自 base 仓库，bootstrap 前先在 fork 侧验证）
  push:
    branches: [master, main]
  # 也允许手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      # 测试依赖 ffmpeg >= 8 的输出格式（Ubuntu 24.04 自带 6.1 缺少 filters 分隔行）
      # 使用 Jellyfin 发行版 ffmpeg；锁定 8.x/8.1.2-4 而非滚动 latest-8.x 目录，避免 CI 随上游发布漂移
      - name: Install ffmpeg (>= 8)
        run: |
          curl -sL https://repo.jellyfin.org/files/ffmpeg/linux/8.x/8.1.2-4/amd64/jellyfin-ffmpeg_8.1.2-4_portable_linux64-gpl.tar.xz -o /tmp/ffmpeg.tar.xz
          mkdir /tmp/ff && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ff
          sudo mv /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/

      - name: Download deps
        run: go mod download

      # === Lint ===
      - name: Lint (Go)
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "gofmt needed"; exit 1; }

      # === Test ===
      - name: Test (Go)
        run: go test -v ./...

      # === Build (验证可构建) ===
      - name: Build (Go)
        run: go build ./...
